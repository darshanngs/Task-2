<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #263b5e;
            color: white;
            text-align: center;
            padding: 24px 16px;
        }

        .container {
            max-width: 800px;
            margin: 32px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #263b5e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #3c5b8c;
        }

        footer {
            text-align: center;
            padding: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>My first HTML and CSS project</p>
    </header>

    <main class="container">
        <h2>About This Page</h2>
        <p>This is a simple static webpage created using HTML and CSS.</p>
        <p>HTML provides the structure, while CSS controls the appearance and layout.</p>
        <a class="button" href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank" rel="noopener noreferrer">Learn HTML</a>
    </main>

    <footer>
        <p>Created as Task 1: Environment Setup and Basic HTML/CSS</p>
    </footer>
</body>
</html>
